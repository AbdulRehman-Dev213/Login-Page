<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lobster&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <header>
        <h2 class="logo">Login Page</h2>
        <nav class="nav-bar">
            <a href="#" class="nav-items">Home</a>
            <a href="#" class="nav-items">About</a>
            <a href="#" class="nav-items">Services</a>
            <a href="#" class="nav-items">Projects</a>
            <a href="#" class="nav-items">Contact</a>
            <button class="login-btn">Login</button>
        </nav>
    </header>
    <div class="wrapper">
        <div class=" login-box">
            <h1>Login</h1>
            <form action="">
                <div class="input-box">
                    <span class="icon"><ion-icon name="mail"></ion-icon></span>
                    <input type="email" name="Email" id="Email" autocomplete="email" required>
                    <label for="Email">Email</label>
                </div>
                <div class="input-box">
                    <span class="icon lock-icon"><ion-icon name="lock-closed"></ion-icon></span>
                    <input type="password" name="Password" id="Password" autocomplete="current-password" required>
                    <label for="Password">Password</label>
                </div>
                <div class="remember-forgot">
                    <label for="rememberMe"> <input type="checkbox" id="rememberMe">Remember Me</label>
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="Submit">Login</button>
                <div class="Register">
                    Dont have an account?
                    <a href="#">Register</a>
                </div>
            </form>
        </div>
    </div>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>

</html>
